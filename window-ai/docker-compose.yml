services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-windowai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-windowai}
      POSTGRES_DB: ${POSTGRES_DB:-windowai}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-windowai} -d ${POSTGRES_DB:-windowai}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-windowai}:${POSTGRES_PASSWORD:-windowai}@db:5432/${POSTGRES_DB:-windowai}
      MODEL_PATH: models/quote_predictor.joblib
      FEATURE_SCHEMA_PATH: models/feature_schema.json
      METRICS_PATH: models/metrics.json
      CURRENCY: CAD
    volumes:
      - ./:/app
      - ./models:/app/models
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m db.init_db &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
